name: pontinho-api

services:
  postgres:
    image: postgres:17
    restart: "no"
    environment:
      POSTGRES_USER: pontinho
      POSTGRES_PASSWORD: pontinho
      POSTGRES_DB: pontinho_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontinho -d pontinho_test"]
      interval: 2s
      timeout: 3s
      retries: 20
